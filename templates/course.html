<!DOCTYPE html>
<!--
  課程頁模板
  使用方式：複製到 courses/<課程slug>/index.html，把 {{COURSE_SLUG}}、{{COURSE_NAME}} 換掉。
  課程內容（圖示、說明、筆記卡片）全部由 main.js 從 data/courses.js 產生，不需要手動寫。
-->
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{COURSE_NAME}} · 我的課程筆記</title>
  <link rel="stylesheet" href="../../assets/css/style.css">
</head>
<body data-page="course" data-course="{{COURSE_SLUG}}" data-root="../../">

  <nav class="topbar">
    <div class="container breadcrumb">
      <a href="../../index.html">📚 首頁</a>
      <span class="sep">/</span>
      <span class="current" id="crumb-course">{{COURSE_NAME}}</span>
    </div>
  </nav>

  <main class="container">
    <header class="page-head" id="course-head"></header>

    <div class="toolbar">
      <label class="search">
        <span class="search-icon" aria-hidden="true">🔍</span>
        <input id="search-input" type="search" placeholder="在這門課中搜尋…" aria-label="搜尋筆記">
      </label>
      <div id="tag-bar" class="tag-bar" aria-label="標籤篩選"></div>
    </div>

    <section>
      <h2 class="section-title">筆記</h2>
      <div id="note-grid" class="card-grid"></div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">內容整理自個人上課講義與筆記，僅供個人複習使用。</div>
  </footer>

  <script src="../../data/courses.js"></script>
  <script src="../../assets/js/main.js"></script>
</body>
</html>
